name: Resolve std.fs/std.path seed conflict

on:
  push:
    branches:
      - feature/std-fs-path-v1

permissions:
  contents: write

jobs:
  rebuild-combined-seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/std-fs-path-v1
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct Stage-0 source
        shell: bash
        run: |
          SOURCE_COMMIT=5e23c57752add5a0cb176309e44b114f8df0c327
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.b64" > /tmp/seed.1.b64
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.2.b64" > /tmp/seed.2.b64
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.3.b64" > /tmp/seed.3.b64
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.4.b64" > /tmp/seed.4.b64
          cat /tmp/seed.1.b64 /tmp/seed.2.b64 /tmp/seed.3.b64 /tmp/seed.4.b64 > /tmp/seed-refresh.b64
          base64 --decode /tmp/seed-refresh.b64 > /tmp/seed-refresh.zip
          printf '%s  %s\n' '794562031c595eeef6764726cac1bfcc2109962a831848d4a1c57c3b337801f4' '/tmp/seed-refresh.zip' | sha256sum -c -
          rm -rf tools/seed-refresh
          mkdir -p tools/seed-refresh
          unzip -q /tmp/seed-refresh.zip -d tools/seed-refresh

      - name: Reapply push/pop and function-clause runtime layers
        shell: bash
        run: |
          git show 8f8a6bef3fdf5ed5c0c18125f680ba01ed8859b3:tools/migrate-list-push-pop.py > /tmp/list-push-pop.py
          python3 - <<'PY'
          from pathlib import Path
          historical = Path('/tmp/list-push-pop.py').read_text()
          seed_section = historical[historical.index('if not SEED.exists():'):]
          prefix = '''from pathlib import Path\n\nROOT = Path('.')\nSEED = ROOT / 'tools/seed-refresh/Beacon.Compiler/Program.cs'\n\ndef replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'Expected exactly one {label} match, found {count}')\n    return text.replace(old, new, 1)\n\n'''
          Path('/tmp/rebuild-current-runtime.py').write_text(prefix + seed_section)
          PY
          python3 /tmp/rebuild-current-runtime.py

      - name: Reapply Number math primitives
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/seed-refresh/Beacon.Compiler/Program.cs')
          text = path.read_text()
          marker = '''    private static readonly BFn StringLength = NativeMethod(0, (self, _) =>\n'''
          methods = '''    private static readonly BFn NumberFloor = NativeMethod(0, (self, _) =>\n        self is double value ? Math.Floor(value) : throw new Exception("floor() requires a Number receiver"));\n\n    private static readonly BFn NumberCeil = NativeMethod(0, (self, _) =>\n        self is double value ? Math.Ceiling(value) : throw new Exception("ceil() requires a Number receiver"));\n\n    private static readonly BFn NumberSqrt = NativeMethod(0, (self, _) =>\n        self is double value ? Math.Sqrt(value) : throw new Exception("sqrt() requires a Number receiver"));\n\n    private static readonly BFn NumberPow = NativeMethod(1, (self, args) =>\n    {\n        if (self is not double value || args[0] is not double exponent)\n            throw new Exception("pow() requires a Number receiver and Number exponent");\n        return Math.Pow(value, exponent);\n    });\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('StringLength insertion marker not found exactly once')
          text = text.replace(marker, methods + marker, 1)
          string_dispatch = '''        if (target is string)\n            return member switch\n'''
          number_dispatch = '''        if (target is double)\n            return member switch\n            {\n                "floor" => NumberFloor,\n                "ceil" => NumberCeil,\n                "sqrt" => NumberSqrt,\n                "pow" => NumberPow,\n                _ => throw new Exception($"Number has no member '{member}'")\n            };\n'''
          if text.count(string_dispatch) != 1:
              raise SystemExit('String dispatch marker not found exactly once')
          text = text.replace(string_dispatch, number_dispatch + string_dispatch, 1)
          path.write_text(text)
          PY

      - name: Reapply List map/filter/head/tail runtime methods
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/seed-refresh/Beacon.Compiler/Program.cs')
          text = path.read_text()
          marker = '''    private static readonly BFn ListConcat = NativeMethod(1, (self, args) =>\n'''
          methods = '''    private static readonly BFn ListMap = NativeMethod(1, (self, args) =>\n    {\n        if (self is not List<object?> list) throw new Exception("map() requires a List receiver");\n        var result = new List<object?>();\n        foreach (var value in list)\n            result.Add(Call(args[0], null, new object?[] { value }));\n        return result;\n    });\n\n    private static readonly BFn ListFilter = NativeMethod(1, (self, args) =>\n    {\n        if (self is not List<object?> list) throw new Exception("filter() requires a List receiver");\n        var result = new List<object?>();\n        foreach (var value in list)\n        {\n            var predicate = Call(args[0], null, new object?[] { value });\n            if (predicate is not bool include)\n                throw new Exception("filter() predicate must return a Boolean");\n            if (include) result.Add(value);\n        }\n        return result;\n    });\n\n    private static readonly BFn ListHead = NativeMethod(0, (self, _) =>\n    {\n        if (self is not List<object?> list) throw new Exception("head() requires a List receiver");\n        if (list.Count == 0) throw new Exception("head() cannot read from an empty List");\n        return list[0];\n    });\n\n    private static readonly BFn ListTail = NativeMethod(0, (self, _) =>\n    {\n        if (self is not List<object?> list) throw new Exception("tail() requires a List receiver");\n        if (list.Count == 0) throw new Exception("tail() cannot read from an empty List");\n        return list.Skip(1).ToList();\n    });\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('ListConcat insertion marker not found exactly once')
          text = text.replace(marker, methods + marker, 1)
          dispatch = '''                "length" => ListLength,\n                "push" => ListPush,\n                "pop" => ListPop,\n                "concat" => ListConcat,\n'''
          replacement = '''                "length" => ListLength,\n                "push" => ListPush,\n                "pop" => ListPop,\n                "map" => ListMap,\n                "filter" => ListFilter,\n                "head" => ListHead,\n                "tail" => ListTail,\n                "concat" => ListConcat,\n'''
          if text.count(dispatch) != 1:
              raise SystemExit('List dispatch marker not found exactly once')
          text = text.replace(dispatch, replacement, 1)
          path.write_text(text)
          PY

      - name: Reapply std.fs/std.path runtime primitives
        shell: bash
        run: |
          git show 9f153b124ba7cecccb5bf6a4973eab323a50bfa3:tools/migrate-fs-path.py > /tmp/migrate-fs-path.py
          python3 /tmp/migrate-fs-path.py

      - name: Build combined Stage-0 seed
        shell: bash
        run: |
          rm -rf /tmp/beacon-stage0
          dotnet publish tools/seed-refresh/Beacon.Compiler/Beacon.Compiler.csproj \
            -c Release \
            -o /tmp/beacon-stage0 \
            -p:UseAppHost=false
          rm -f /tmp/beacon-stage0/*.pdb

      - name: Verify combined runtime
        shell: bash
        run: |
          SEED=/tmp/beacon-stage0/Beacon.Compiler.dll
          COMPILER=compiler/compiler.beacon
          export BEACON_HOME="$PWD"
          dotnet "$SEED" "$COMPILER" --self-host
          [[ "$(dotnet "$SEED" "$COMPILER" --stage1-run examples/list-functional-methods.beacon)" == $'[2, 4, 6, 8]\n[3, 4]\n1\n[2, 3, 4]\n[99, 3, 4]\n[1, 2, 3, 4]\n[]\n[]' ]]
          [[ "$(dotnet "$SEED" "$COMPILER" --stage1-run examples/std-fs-path.beacon)" == $'true\ntrue\nsample.txt\n.txt\nsample\ntrue\ntrue\ntrue\ntrue\n1\n1\ntrue\nfalse\ntrue\ntrue\ntrue\ntrue\ntrue\nfalse\nfalse' ]]

      - name: Install combined seed
        shell: bash
        run: |
          rm -rf bootstrap/stage0
          mkdir -p bootstrap/stage0
          cp /tmp/beacon-stage0/Beacon.Compiler.dll bootstrap/stage0/
          cp /tmp/beacon-stage0/Beacon.Compiler.deps.json bootstrap/stage0/
          cp /tmp/beacon-stage0/Beacon.Compiler.runtimeconfig.json bootstrap/stage0/
          cat > bootstrap/stage0/PROVENANCE.txt <<EOF
          Beacon Stage-0 bootstrap seed
          =============================

          Purpose: immutable CLR bootstrap/runtime boundary for the self-hosted Beacon compiler.
          Seed refresh: filesystem and path primitives for std.fs/std.path, List map()/filter()/head()/tail() methods, Number floor()/ceil()/sqrt()/pow() primitives, List push()/pop() mutation primitives, ordered function-clause dispatch, List-only positional @ indexing, explicit Record get()/set(), seed-only local include composition, and generic namespace plan assembly.
          Historical implementation language: C#
          Source branch: feature/std-fs-path-v1
          .NET SDK: $(dotnet --version)

          The one-time C# refresh source was removed after this seed was built and verified.
          The canonical compiler implementation remains Beacon source under compiler/.
          EOF
          (
            cd bootstrap/stage0
            sha256sum Beacon.Compiler.dll Beacon.Compiler.deps.json Beacon.Compiler.runtimeconfig.json PROVENANCE.txt > SHA256SUMS
          )
          rm -rf tools/seed-refresh

      - name: Commit combined seed
        shell: bash
        run: |
          if find . -path './.git' -prune -o \( -name '*.cs' -o -name '*.csproj' \) -print | grep -q .; then
            echo 'C# source remains after seed refresh.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap/stage0 compiler/emitter.beacon
          git commit -m 'Rebuild Stage-0 with List and fs/path runtime changes'
          git push origin HEAD:feature/std-fs-path-v1
