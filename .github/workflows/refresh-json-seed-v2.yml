name: Refresh std.json seed

on:
  push:
    branches:
      - feature/std-json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/std-json
          fetch-depth: 0
      - run: bash tools/fix-json-style.sh
