name: Package VS Code extension

on:
  pull_request:
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Beacon syntax coverage
        working-directory: editors/vscode
        run: npm run check:syntax

      - name: Verify checked-in VSIX uses the source grammar
        working-directory: editors/vscode
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VSIX="beacon-lang-$VERSION.vsix"

          if [[ ! -f "$VSIX" ]]; then
            echo "Packaged extension not found: $VSIX" >&2
            exit 1
          fi

          unzip -p "$VSIX" extension/syntaxes/beacon.tmLanguage.json > /tmp/beacon-packaged-grammar.json
          diff -u syntaxes/beacon.tmLanguage.json /tmp/beacon-packaged-grammar.json

      - name: Install extension build dependencies
        working-directory: editors/vscode
        run: npm install --no-audit --no-fund

      - name: Package VS Code extension
        working-directory: editors/vscode
        run: npm run package

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: beacon-vscode-extension
          path: editors/vscode/beacon-lang-*.vsix

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" editors/vscode/beacon-lang-*.vsix --clobber
