name: List-only indexing migration

on:
  push:
    branches:
      - feature/list-only-indexing

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/list-only-indexing
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Migrate Beacon source
        run: python3 tools/migrate-list-only.py

      - name: Audit source semantics
        shell: bash
        run: |
          if grep -R -n -P --include='*.beacon' '[A-Za-z0-9_\)]@"[A-Za-z_]' compiler std examples; then
            echo 'Quoted Record @ access remains.' >&2
            exit 1
          fi
          if grep -n -E 'source@index|characters@i' compiler/lexer.beacon; then exit 1; fi
          if grep -n -F 'source@i' compiler/diagnostics.beacon; then exit 1; fi
          if grep -n -E 'typeName@i|left@i|right@i' compiler/typecheck.beacon; then exit 1; fi
          for pattern in 'children@part' 'children@key' 'root@name' 'members@key' 'members@(' 'types@typeName' 'types@(' 'value@key'; do
            if grep -R -n --include='*.beacon' -F "$pattern" compiler std examples; then
              echo "Legacy Record @ usage remains: $pattern" >&2
              exit 1
            fi
          done

      - name: Reconstruct verified seed refresh source
        shell: bash
        run: |
          printf '%s  %s\n' '3cd0d9ceb7df4d23f642dc2267639711f48d2713e20d62781386fb05d6b33383' 'tools/seed-refresh-source.b64' | sha256sum -c -
          printf '%s  %s\n' 'e857abea81ff338db7bab1f83157ca3670d8cf40298965e9088d77df82372ba2' 'tools/seed-refresh-source.2.b64' | sha256sum -c -
          printf '%s  %s\n' '2d21335faa5f6254db756e98e3c92c3e086de4456b543fc3559d103816f93401' 'tools/seed-refresh-source.3.b64' | sha256sum -c -
          printf '%s  %s\n' '40dcd88dcea5d90079f190619675b75c5b2cfdb4c47842f5423986ea05d7519d' 'tools/seed-refresh-source.4.b64' | sha256sum -c -

          cat tools/seed-refresh-source.b64 \
              tools/seed-refresh-source.2.b64 \
              tools/seed-refresh-source.3.b64 \
              tools/seed-refresh-source.4.b64 > /tmp/seed-refresh.b64
          base64 --decode /tmp/seed-refresh.b64 > /tmp/seed-refresh.zip
          printf '%s  %s\n' '794562031c595eeef6764726cac1bfcc2109962a831848d4a1c57c3b337801f4' '/tmp/seed-refresh.zip' | sha256sum -c -

          rm -rf tools/seed-refresh
          mkdir -p tools/seed-refresh
          unzip -q /tmp/seed-refresh.zip -d tools/seed-refresh

      - name: Build refreshed Stage-0 seed
        shell: bash
        run: |
          rm -rf /tmp/beacon-stage0
          dotnet publish tools/seed-refresh/Beacon.Compiler/Beacon.Compiler.csproj \
            -c Release \
            -o /tmp/beacon-stage0 \
            -p:UseAppHost=false
          rm -f /tmp/beacon-stage0/*.pdb

      - name: Verify self-hosting and semantics
        shell: bash
        run: |
          SEED=/tmp/beacon-stage0/Beacon.Compiler.dll
          COMPILER=compiler/compiler.beacon
          export BEACON_HOME="$PWD"

          dotnet "$SEED" "$COMPILER" --self-host
          dotnet "$SEED" "$COMPILER" --stage1-run examples/includes/main.beacon
          dotnet "$SEED" "$COMPILER" --stage1-run examples/bootstrap-primitives.beacon

          cat > /tmp/list-index.beacon <<'BEACON'
          values: list = [10, 20, 30]
          print(values@1)
          values@1 = 42
          print(values@1)
          BEACON
          list_output="$(dotnet "$SEED" "$COMPILER" --stage1-run /tmp/list-index.beacon)"
          grep -Fx '20' <<<"$list_output"
          grep -Fx '42' <<<"$list_output"

          cat > /tmp/record-index.beacon <<'BEACON'
          value: record = { name: "Ada" }
          print(value@0)
          BEACON
          set +e
          record_output="$(dotnet "$SEED" "$COMPILER" --stage1-run /tmp/record-index.beacon 2>&1)"
          record_status=$?
          set -e
          [[ $record_status -ne 0 ]]
          grep -F '@ requires a List on the left' <<<"$record_output"

          cat > /tmp/string-index.beacon <<'BEACON'
          value: string = "Beacon"
          print(value@0)
          BEACON
          set +e
          string_output="$(dotnet "$SEED" "$COMPILER" --stage1-run /tmp/string-index.beacon 2>&1)"
          string_status=$?
          set -e
          [[ $string_status -ne 0 ]]
          grep -F '@ requires a List on the left' <<<"$string_output"

          cat > /tmp/record-methods.beacon <<'BEACON'
          value: record = { name: "Ada" }
          key: string = "name"
          print(value.get(key))
          value.set(key, "Grace")
          print(value.name)
          BEACON
          record_output="$(dotnet "$SEED" "$COMPILER" --stage1-run /tmp/record-methods.beacon)"
          grep -Fx 'Ada' <<<"$record_output"
          grep -Fx 'Grace' <<<"$record_output"

      - name: Install refreshed seed
        shell: bash
        run: |
          rm -rf bootstrap/stage0
          mkdir -p bootstrap/stage0
          cp /tmp/beacon-stage0/Beacon.Compiler.dll bootstrap/stage0/
          cp /tmp/beacon-stage0/Beacon.Compiler.deps.json bootstrap/stage0/
          cp /tmp/beacon-stage0/Beacon.Compiler.runtimeconfig.json bootstrap/stage0/

          cat > bootstrap/stage0/PROVENANCE.txt <<EOF
          Beacon Stage-0 bootstrap seed
          =============================

          Purpose: immutable CLR bootstrap/runtime boundary for the self-hosted Beacon compiler.
          Seed refresh: List-only positional @ indexing, explicit Record get()/set(), filesystem/path primitives, seed-only local include composition, and generic namespace plan assembly.
          Historical implementation language: C#
          Source branch: feature/list-only-indexing
          .NET SDK: $(dotnet --version)

          The one-time C# refresh source was removed after this seed was built and verified.
          The canonical compiler implementation remains Beacon source under compiler/.
          EOF

          (
            cd bootstrap/stage0
            sha256sum Beacon.Compiler.dll Beacon.Compiler.deps.json Beacon.Compiler.runtimeconfig.json PROVENANCE.txt > SHA256SUMS
          )

          export BEACON_HOME="$PWD"
          dotnet bootstrap/stage0/Beacon.Compiler.dll compiler/compiler.beacon --self-host

      - name: Commit clean migration
        shell: bash
        run: |
          rm -rf tools/seed-refresh
          rm -f tools/seed-refresh-source.zip
          rm -f tools/seed-refresh-source.b64 tools/seed-refresh-source.2.b64 tools/seed-refresh-source.3.b64 tools/seed-refresh-source.4.b64
          rm -f tools/migrate-list-only.py
          rm -f .github/workflows/indexing-audit.yml

          if find . -path './.git' -prune -o \( -name '*.cs' -o -name '*.csproj' \) -print | grep -q .; then
            echo 'C# source remains after seed refresh.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make @ indexing List-only'
          git push origin HEAD:feature/list-only-indexing
