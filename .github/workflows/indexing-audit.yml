name: Indexing audit

on:
  push:
    branches:
      - feature/list-only-indexing

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show all Beacon @ usage
        shell: bash
        run: |
          grep -R -n --include='*.beacon' '@' compiler std examples || true
