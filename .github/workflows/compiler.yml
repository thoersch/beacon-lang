name: Beacon compiler

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  compiler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify self-hosting
        run: bash ./beacon.sh self-host

      - name: Verify structured nested-field diagnostic
        shell: bash
        run: |
          cat > /tmp/beacon-diagnostic-test.beacon <<'BEACON'
          address: type = {
              street: string
              city: string
              state: string
          }

          person: type = {
              name: string
              age: number
              home: address
          }

          ada: person = {
              name: "Ada"
              age: 42
              home: {
                  strqeet: "1 Beacon St"
                  city: "Boston"
                  state: "MA"
              }
          }
          BEACON

          set +e
          output="$(bash ./beacon.sh /tmp/beacon-diagnostic-test.beacon 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if [[ $status -eq 0 ]]; then
            echo "Expected invalid Beacon program to fail compilation." >&2
            exit 1
          fi

          grep -F "[B1002]" <<<"$output"
          grep -F "Unknown field 'strqeet' in address" <<<"$output"
          grep -F "while checking: ada.home.strqeet" <<<"$output"
          grep -F "hint: Did you mean 'street'?" <<<"$output"
          grep -F "strqeet: \"1 Beacon St\"" <<<"$output"
          grep -F "^^^^^^^" <<<"$output"

      - name: Verify List-only indexing semantics
        shell: bash
        run: |
          cat > /tmp/list-index.beacon <<'BEACON'
          values: list = [10, 20, 30]
          print(values@1)
          values@1 = 42
          print(values@1)
          BEACON

          list_output="$(bash ./beacon.sh /tmp/list-index.beacon)"
          grep -Fx '20' <<<"$list_output"
          grep -Fx '42' <<<"$list_output"

          cat > /tmp/record-index.beacon <<'BEACON'
          value: record = { name: "Ada" }
          print(value@"name")
          BEACON

          set +e
          record_output="$(bash ./beacon.sh /tmp/record-index.beacon 2>&1)"
          record_status=$?
          set -e
          [[ $record_status -ne 0 ]]
          grep -F '@ requires a List on the left' <<<"$record_output"

          cat > /tmp/string-index.beacon <<'BEACON'
          value: string = "Beacon"
          print(value@0)
          BEACON

          set +e
          string_output="$(bash ./beacon.sh /tmp/string-index.beacon 2>&1)"
          string_status=$?
          set -e
          [[ $string_status -ne 0 ]]
          grep -F '@ requires a List on the left' <<<"$string_output"

          cat > /tmp/record-methods.beacon <<'BEACON'
          value: record = { name: "Ada" }
          key: string = "name"
          print(value.get(key))
          value.set(key, "Grace")
          print(value.name)
          BEACON

          record_output="$(bash ./beacon.sh /tmp/record-methods.beacon)"
          grep -Fx 'Ada' <<<"$record_output"
          grep -Fx 'Grace' <<<"$record_output"

      - name: Verify List push/pop semantics
        shell: bash
        run: |
          cat > /tmp/list-stack.beacon <<'BEACON'
          values: list = [1, 2]
          values.push(3)
          print(values)
          print(values.pop())
          print(values)
          BEACON

          output="$(bash ./beacon.sh /tmp/list-stack.beacon)"
          printf '%s\n' "$output"
          expected=$'[1, 2, 3]\n3\n[1, 2]'
          [[ "$output" == "$expected" ]]

          cat > /tmp/append-removed.beacon <<'BEACON'
          values: list = [1]
          values.append(2)
          BEACON
          set +e
          append_output="$(bash ./beacon.sh /tmp/append-removed.beacon 2>&1)"
          append_status=$?
          set -e
          [[ $append_status -ne 0 ]]
          grep -F "List has no member 'append'" <<<"$append_output"

          cat > /tmp/pop-empty.beacon <<'BEACON'
          values: list = []
          values.pop()
          BEACON
          set +e
          pop_output="$(bash ./beacon.sh /tmp/pop-empty.beacon 2>&1)"
          pop_status=$?
          set -e
          [[ $pop_status -ne 0 ]]
          grep -F 'pop() cannot remove from an empty List' <<<"$pop_output"

          if grep -R '\.append(' compiler examples std --include='*.beacon'; then
            echo 'Beacon source still uses append().' >&2
            exit 1
          fi

      - name: Verify ordered function clauses
        shell: bash
        run: |
          output="$(bash ./beacon.sh examples/function-clauses.beacon)"
          printf '%s\n' "$output"

          expected=$'fn\nstring\nnumber\natom\nacon\neac\nvalue:Ada\nvalue:number\nperson\nscalar'
          [[ "$output" == "$expected" ]]

          cat > /tmp/no-function-clause.beacon <<'BEACON'
          onlyNumber: fn = [
              fn(value: number) = value
          ]
          print(onlyNumber("Beacon"))
          BEACON

          set +e
          no_match="$(bash ./beacon.sh /tmp/no-function-clause.beacon 2>&1)"
          status=$?
          set -e
          [[ $status -ne 0 ]]
          grep -F 'No matching function clause for (string)' <<<"$no_match"

          cat > /tmp/legacy-function.beacon <<'BEACON'
          twice: fn(value: number) = value * 2
          print(twice(21))
          BEACON
          [[ "$(bash ./beacon.sh /tmp/legacy-function.beacon)" == '42' ]]

      - name: Verify multiline expressions
        shell: bash
        run: |
          output="$(bash ./beacon.sh examples/multiline-expressions.beacon)"
          printf '%s\n' "$output"
          expected=$'7\n43\n-5\n15\nmultiline\n42'
          [[ "$output" == "$expected" ]]

      - name: Verify unary minus and loop control
        shell: bash
        run: |
          output="$(bash ./beacon.sh examples/unary-loop-control.beacon)"
          printf '%s\n' "$output"
          expected=$'-1\n-4\n3\n-6\n2\n8\n3\n3'
          [[ "$output" == "$expected" ]]

          cat > /tmp/break-outside.beacon <<'BEACON'
          break
          BEACON
          set +e
          break_output="$(bash ./beacon.sh /tmp/break-outside.beacon 2>&1)"
          break_status=$?
          set -e
          [[ $break_status -ne 0 ]]
          grep -F "'break' can only be used inside a loop" <<<"$break_output"

          cat > /tmp/continue-outside.beacon <<'BEACON'
          continue
          BEACON
          set +e
          continue_output="$(bash ./beacon.sh /tmp/continue-outside.beacon 2>&1)"
          continue_status=$?
          set -e
          [[ $continue_status -ne 0 ]]
          grep -F "'continue' can only be used inside a loop" <<<"$continue_output"

          cat > /tmp/function-boundary.beacon <<'BEACON'
          for [i: number = 0, i < 1, i += 1]
              illegal: fn() = [
                  break
              ]
          loop
          BEACON
          set +e
          boundary_output="$(bash ./beacon.sh /tmp/function-boundary.beacon 2>&1)"
          boundary_status=$?
          set -e
          [[ $boundary_status -ne 0 ]]
          grep -F "'break' can only be used inside a loop" <<<"$boundary_output"
