name: Fix std.json style

on:
  push:
    branches:
      - feature/std-json
    paths:
      - .github/workflows/fix-json-style.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/std-json
      - name: Flatten nested else-if
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('std/json.beacon')
          text = path.read_text()
          old = '''        else
            if _jsonControlCode(character) >= 0 then
                _jsonError(state, "Unescaped control character in string")
            end
            result += character
'''
          new = '''        else if _jsonControlCode(character) >= 0 then
            _jsonError(state, "Unescaped control character in string")
        else
            result += character
'''
          if text.count(old) != 1:
              raise SystemExit('Expected one nested string-control conditional')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-json-style.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add std/json.beacon
          git add -u .github/workflows/fix-json-style.yml
          git commit -m 'Use canonical else-if style in std.json'
          git push origin HEAD:feature/std-json
