name: Rebuild checked-in VS Code package

on:
  push:
    branches:
      - fix/vscode-when-otherwise-package

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/vscode-when-otherwise-package

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show packaged grammar drift before rebuild
        working-directory: editors/vscode
        continue-on-error: true
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          unzip -p "beacon-lang-$VERSION.vsix" extension/syntaxes/beacon.tmLanguage.json > /tmp/beacon-packaged-grammar.json
          diff -u /tmp/beacon-packaged-grammar.json syntaxes/beacon.tmLanguage.json

      - name: Install extension build dependencies
        working-directory: editors/vscode
        run: npm install --no-audit --no-fund

      - name: Audit syntax coverage
        working-directory: editors/vscode
        run: npm run check:syntax

      - name: Rebuild package
        working-directory: editors/vscode
        run: npm run package

      - name: Verify rebuilt package grammar
        working-directory: editors/vscode
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          unzip -p "beacon-lang-$VERSION.vsix" extension/syntaxes/beacon.tmLanguage.json > /tmp/beacon-rebuilt-grammar.json
          diff -u syntaxes/beacon.tmLanguage.json /tmp/beacon-rebuilt-grammar.json

      - name: Commit rebuilt package
        run: |
          if git diff --quiet -- editors/vscode/beacon-lang-*.vsix; then
            echo "Checked-in VSIX is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editors/vscode/beacon-lang-*.vsix
          git commit -m "Rebuild VS Code extension package"
          git push origin HEAD:fix/vscode-when-otherwise-package
