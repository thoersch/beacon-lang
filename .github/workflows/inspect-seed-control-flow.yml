name: Inspect seed control flow

on:
  push:
    branches:
      - feature/conditional-expressions-when

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/conditional-expressions-when
          fetch-depth: 0

      - name: Reconstruct archived seed source
        shell: bash
        run: |
          SOURCE_COMMIT=5e23c57752add5a0cb176309e44b114f8df0c327
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.b64" > /tmp/seed.1.b64
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.2.b64" > /tmp/seed.2.b64
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.3.b64" > /tmp/seed.3.b64
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.4.b64" > /tmp/seed.4.b64
          cat /tmp/seed.1.b64 /tmp/seed.2.b64 /tmp/seed.3.b64 /tmp/seed.4.b64 > /tmp/seed-refresh.b64
          base64 --decode /tmp/seed-refresh.b64 > /tmp/seed-refresh.zip
          unzip -q /tmp/seed-refresh.zip -d /tmp/seed-refresh

      - name: Show conditional parser implementation
        shell: bash
        run: |
          PROGRAM=/tmp/seed-refresh/Beacon.Compiler/Program.cs
          grep -n -E 'ParseIf|ParseStatement|ParsePrimary|else|Expected.*else' "$PROGRAM" | head -120
          echo '--- ParseIf context ---'
          line="$(grep -n 'ParseIf' "$PROGRAM" | head -1 | cut -d: -f1)"
          start=$((line-30))
          end=$((line+120))
          sed -n "${start},${end}p" "$PROGRAM"
