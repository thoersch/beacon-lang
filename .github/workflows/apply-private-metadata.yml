name: Apply private function metadata

on:
  push:
    branches:
      - feature/std-json
    paths:
      - "tools/apply-private-metadata.py"
      - ".github/workflows/apply-private-metadata.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/std-json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply source changes
        run: python3 tools/apply-private-metadata.py

      - name: Verify fixed-point self-hosting
        run: bash ./beacon.sh self-host

      - name: Verify private metadata behavior
        shell: bash
        run: |
          set -euo pipefail
          bash ./beacon.sh examples/std-json.beacon >/tmp/std-json.out

          cat > /tmp/private-export.beacon <<'EOF'
          include std.json
          json.parseValue
          EOF
          if bash ./beacon.sh /tmp/private-export.beacon >/tmp/private-export.out 2>/tmp/private-export.err; then
            echo 'Expected private helper to be hidden from json namespace' >&2
            exit 1
          fi

          cat > /tmp/private-nested.beacon <<'EOF'
          outer: fn() = [
              helper: fn<private>() = 1,
              helper()
          ]
          outer()
          EOF
          if bash ./beacon.sh /tmp/private-nested.beacon >/tmp/private-nested.out 2>/tmp/private-nested.err; then
            echo 'Expected nested fn<private> to fail' >&2
            exit 1
          fi

          cat > /tmp/private-unknown.beacon <<'EOF'
          helper: fn<internal>() = 1
          EOF
          if bash ./beacon.sh /tmp/private-unknown.beacon >/tmp/private-unknown.out 2>/tmp/private-unknown.err; then
            echo 'Expected unknown function metadata to fail' >&2
            exit 1
          fi

      - name: Verify Beacon style
        run: bash ./beacon.sh tools/check-beacon-style.beacon

      - name: Audit and rebuild VS Code extension
        working-directory: editors/vscode
        shell: bash
        run: |
          set -euo pipefail
          npm run check:syntax
          npm ci --no-audit --no-fund
          VERSION="$(node -p "require('./package.json').version")"
          rm -f "beacon-lang-$VERSION.vsix"
          npm run package
          unzip -p "beacon-lang-$VERSION.vsix" extension/syntaxes/beacon.tmLanguage.json > /tmp/beacon-packaged-grammar.json
          diff -u syntaxes/beacon.tmLanguage.json /tmp/beacon-packaged-grammar.json

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/parser.beacon compiler/core.beacon compiler/emitter.beacon \
            std/json.beacon docs/src/content/docs/language/syntax.md \
            docs/src/content/docs/standard-library/json.md \
            editors/vscode/syntaxes/beacon.tmLanguage.json editors/vscode/check-syntax.mjs \
            editors/vscode/beacon-lang-0.1.1.vsix
          git commit -m "Add private function metadata"
          git push origin HEAD:feature/std-json
