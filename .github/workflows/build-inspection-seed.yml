name: Build frozen live-inspection runtime
# Rebuild isolated Windows child process launch and preserve CLI stdout behavior.
on:
  push:
    branches:
      - feature/live-runtime-inspection
    paths:
      - .github/workflows/build-inspection-seed.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-runtime-inspection
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct verified seed source
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/thoersch/beacon-lang/d6680d72646aed04cda62fdb76c74325c640cd94
          curl -fsSL "$base/tools/reconstruct-current-seed.py" -o /tmp/reconstruct.py
          curl -fsSL "$base/tools/migrate-fs-path-boundary.py" -o /tmp/fs.py
          curl -fsSL "$base/tools/patch-seed-secondary-host-table.py" -o /tmp/host.py
          python3 /tmp/reconstruct.py
          python3 /tmp/fs.py seed
          python3 /tmp/host.py

      - name: Rebuild verified native window and dark UI lineage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/thoersch/beacon-lang/d2026b1c24b0287ccf0753cf2e88a0be05e16c92/tools/refresh-window-ui-seed.py -o /tmp/window.py
          curl -fsSL https://raw.githubusercontent.com/thoersch/beacon-lang/40597cbd673736be2c437503bd39d8681ba05c89/tools/refine-window-ui-seed.py -o /tmp/refine.py
          curl -fsSL https://raw.githubusercontent.com/thoersch/beacon-lang/40597cbd673736be2c437503bd39d8681ba05c89/tools/fix-window-ui-lazy-init.py -o /tmp/lazy.py
          curl -fsSL https://raw.githubusercontent.com/thoersch/beacon-lang/4634e74bb60a3ce5a51ded5b5d325ab798917e08/tools/fix-native-inspector-paint.py -o /tmp/paint.py
          curl -fsSL https://raw.githubusercontent.com/thoersch/beacon-lang/27b4e4352622dd9b2df443445ff9185668e064b/tools/fix-inspector-input-placeholder.py -o /tmp/placeholder.py
          python3 /tmp/window.py seed
          python3 /tmp/refine.py
          python3 /tmp/lazy.py
          python3 /tmp/paint.py
          python3 /tmp/placeholder.py

      - name: Add live runtime inspection
        shell: bash
        run: |
          set -euo pipefail
          cp tools/inspector-runtime/Inspection.cs tools/seed-refresh/Beacon.Compiler/Inspection.cs
          python3 tools/inspector-runtime/patch-seed.py
          grep -F 'Runtime.HostInspect' tools/seed-refresh/Beacon.Compiler/Program.cs
          grep -F 'BeginInspection(targetPath)' tools/seed-refresh/Beacon.Compiler/Program.cs

      - name: Publish frozen Stage-0
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish tools/seed-refresh/Beacon.Compiler/Beacon.Compiler.csproj -c Release -o /tmp/beacon-live-stage0 -p:UseAppHost=false
          rm -f /tmp/beacon-live-stage0/*.pdb
          rm -rf bootstrap/stage0
          mkdir bootstrap/stage0
          cp /tmp/beacon-live-stage0/Beacon.Compiler.dll bootstrap/stage0/
          cp /tmp/beacon-live-stage0/Beacon.Compiler.deps.json bootstrap/stage0/
          cp /tmp/beacon-live-stage0/Beacon.Compiler.runtimeconfig.json bootstrap/stage0/
          cat > bootstrap/stage0/PROVENANCE.txt <<EOF
          Beacon Stage-0 bootstrap seed
          =============================

          Purpose: immutable CLR bootstrap/runtime boundary for the self-hosted Beacon compiler.
          Seed refresh: adds opt-in local inspection through hostInspect(action,payload). Target processes expose root Beacon environments over same-user named pipes when started with --inspect. Snapshots are read-only, recursively bounded, and serialized as Atom/List/Record-compatible values. The existing native window and polished dark control rendering remains intact.
          Historical implementation language: C#
          Source branch: feature/live-runtime-inspection
          .NET SDK: $(dotnet --version)

          The temporary reconstruction and C# source are removed after the frozen seed passes fixed-point verification.
          Beacon's canonical compiler remains under compiler/.
          EOF
          (cd bootstrap/stage0 && sha256sum Beacon.Compiler.dll Beacon.Compiler.deps.json Beacon.Compiler.runtimeconfig.json PROVENANCE.txt > SHA256SUMS)

      - name: Verify self-host and disconnected inspection
        shell: bash
        run: |
          set -euo pipefail
          export BEACON_HOME="$PWD"
          bash ./beacon.sh self-host
          echo 'include std.inspect' >/tmp/inspect-offline.beacon
          echo 'result: record = inspect.snapshot(999999)' >>/tmp/inspect-offline.beacon
          echo 'print(result.connected)' >>/tmp/inspect-offline.beacon
          result="$(bash ./beacon.sh /tmp/inspect-offline.beacon)"
          [ "$result" = false ]
          if find . -path './.git' -prune -o -path './tools/seed-refresh' -prune -o -path './tools/inspector-runtime' -prune -o -name '*.cs' -print | grep -q .; then
            echo 'Unexpected C# source outside temporary seed folder' >&2
            exit 1
          fi

      - name: Remove one-time host source and commit frozen binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/seed-refresh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap/stage0
          git commit -m 'Add frozen opt-in Beacon runtime inspection agent'
          git fetch origin feature/live-runtime-inspection
          git rebase origin/feature/live-runtime-inspection
          git push origin HEAD:feature/live-runtime-inspection
