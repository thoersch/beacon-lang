name: Refine Stage-0 native UI rendering

on:
  push:
    branches:
      - refine/polished-native-ui
    paths:
      - tools/refine-window-ui-seed.py
      - .github/workflows/refine-window-ui-seed.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refine/polished-native-ui
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct current Stage-0 source lineage
        shell: bash
        run: |
          set -euo pipefail
          MIGRATION=d6680d72646aed04cda62fdb76c74325c640cd94
          BASE="https://raw.githubusercontent.com/thoersch/beacon-lang/$MIGRATION"
          curl -fsSL "$BASE/tools/reconstruct-current-seed.py" -o /tmp/reconstruct-current-seed.py
          curl -fsSL "$BASE/tools/migrate-fs-path-boundary.py" -o /tmp/migrate-fs-path-boundary.py
          curl -fsSL "$BASE/tools/patch-seed-secondary-host-table.py" -o /tmp/patch-seed-secondary-host-table.py
          python3 /tmp/reconstruct-current-seed.py
          python3 /tmp/migrate-fs-path-boundary.py seed
          python3 /tmp/patch-seed-secondary-host-table.py

      - name: Reapply native window boundary baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/thoersch/beacon-lang/d2026b1c24b0287ccf0753cf2e88a0be05e16c92/tools/refresh-window-ui-seed.py" -o /tmp/refresh-window-ui-seed.py
          python3 /tmp/refresh-window-ui-seed.py seed

      - name: Apply polished native rendering
        run: python3 tools/refine-window-ui-seed.py

      - name: Verify reconstructed native boundary
        shell: bash
        run: |
          set -euo pipefail
          PROGRAM=tools/seed-refresh/Beacon.Compiler/Program.cs
          grep -F 'BeaconApplyWindowChrome' "$PROGRAM"
          grep -F 'BeaconWmCtlColorEdit' "$PROGRAM"
          grep -F 'BeaconDrawControl' "$PROGRAM"
          grep -F 'DarkMode_Explorer' "$PROGRAM"
          grep -F 'Segoe UI' "$PROGRAM"
          grep -F 'Consolas' "$PROGRAM"

      - name: Build refreshed Stage-0 seed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/beacon-stage0
          dotnet publish tools/seed-refresh/Beacon.Compiler/Beacon.Compiler.csproj -c Release -o /tmp/beacon-stage0 -p:UseAppHost=false
          rm -f /tmp/beacon-stage0/*.pdb

      - name: Install refreshed seed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap/stage0
          mkdir -p bootstrap/stage0
          cp /tmp/beacon-stage0/Beacon.Compiler.dll bootstrap/stage0/
          cp /tmp/beacon-stage0/Beacon.Compiler.deps.json bootstrap/stage0/
          cp /tmp/beacon-stage0/Beacon.Compiler.runtimeconfig.json bootstrap/stage0/
          cat > bootstrap/stage0/PROVENANCE.txt <<EOF
          Beacon Stage-0 bootstrap seed
          =============================

          Purpose: immutable CLR bootstrap/runtime boundary for the self-hosted Beacon compiler.
          Seed refresh: refines the existing hostWindow(action, payload) Windows backend with dark window chrome, modern typography, themed edit controls, owner-drawn buttons and panels, and consistent native colors. UI structure, layout, semantic visual roles, and callback routing remain Beacon code under std/ui.beacon. hostCharacter(Number), flattened else-if support, and the reduced filesystem/path boundary are preserved.
          Historical implementation language: C#
          Source branch: refine/polished-native-ui
          .NET SDK: $(dotnet --version)

          The one-time C# refresh source was reconstructed from the verified historical migration lineage and removed after this seed was built and fixed-point verified.
          The canonical compiler implementation remains Beacon source under compiler/.
          EOF
          (cd bootstrap/stage0 && sha256sum Beacon.Compiler.dll Beacon.Compiler.deps.json Beacon.Compiler.runtimeconfig.json PROVENANCE.txt > SHA256SUMS)

      - name: Verify fixed-point self-hosting and portable Inspector
        shell: bash
        run: |
          set -euo pipefail
          export BEACON_HOME="$PWD"
          bash ./beacon.sh self-host
          output="$(bash ./beacon.sh examples/inspector-ui.beacon)"
          expected='Beacon Inspector UI is not available on unsupported'
          [ "$output" = "$expected" ]

      - name: Remove one-time refresh machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/seed-refresh
          rm -f tools/refine-window-ui-seed.py
          rm -f .github/workflows/refine-window-ui-seed.yml
          if find . -path './.git' -prune -o \( -name '*.cs' -o -name '*.csproj' \) -print | grep -q .; then
            echo 'C# source remains after seed refresh.' >&2
            find . -path './.git' -prune -o \( -name '*.cs' -o -name '*.csproj' \) -print >&2
            exit 1
          fi

      - name: Commit verified polished seed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap/stage0 tools/refine-window-ui-seed.py .github/workflows/refine-window-ui-seed.yml
          git commit -m 'Polish native window and control rendering'
          git push origin HEAD:refine/polished-native-ui
