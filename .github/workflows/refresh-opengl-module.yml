name: Refresh independent OpenGL module artifact
on:
  push:
    branches: [feature/graphics-opengl-native-extension]
    paths: [.github/workflows/refresh-opengl-module.yml]
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/graphics-opengl-native-extension
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile binding with no external packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet build native/opengl/Beacon.Native.opengl.csproj -c Release -o /tmp/beacon-opengl-verified -p:UseAppHost=false
          cp /tmp/beacon-opengl-verified/Beacon.Native.opengl.dll native/opengl/
          (cd native/opengl && sha256sum Beacon.Native.opengl.dll > SHA256SUMS)
      - name: Commit verified graphics binding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/opengl/Beacon.Native.opengl.dll native/opengl/SHA256SUMS
          git commit -m 'Freeze tested, standalone WGL/OpenGL module'
          git fetch origin feature/graphics-opengl-native-extension
          git rebase origin/feature/graphics-opengl-native-extension
          git push origin HEAD:feature/graphics-opengl-native-extension
