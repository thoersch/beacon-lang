name: Apply Beacon else-if style

on:
  push:
    branches:
      - feature/conditional-expressions-when
    paths:
      - .github/workflows/apply-else-if-style.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/conditional-expressions-when

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Flatten conditional chains
        run: |
          python3 tools/check-beacon-style.py --fix
          python3 tools/check-beacon-style.py

      - name: Verify self-hosting
        run: bash ./beacon.sh self-host

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-else-if-style.yml

      - name: Commit style migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler std examples .github/workflows/apply-else-if-style.yml
          git commit -m 'Adopt flattened else-if style'
          git push origin HEAD:feature/conditional-expressions-when
