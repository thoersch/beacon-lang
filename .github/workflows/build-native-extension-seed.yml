name: Build native extension bootstrap
# Refresh window class with CS_OWNDC for stable WGL contexts.
on:
  push:
    branches: [feature/graphics-opengl-native-extension]
    paths: [.github/workflows/build-native-extension-seed.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/graphics-opengl-native-extension
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct frozen host from verified lineage
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/thoersch/beacon-lang/d6680d72646aed04cda62fdb76c74325c640cd94
          curl -fsSL "$base/tools/reconstruct-current-seed.py" -o /tmp/reconstruct.py
          curl -fsSL "$base/tools/migrate-fs-path-boundary.py" -o /tmp/fs.py
          curl -fsSL "$base/tools/patch-seed-secondary-host-table.py" -o /tmp/host.py
          python3 /tmp/reconstruct.py
          python3 /tmp/fs.py seed
          python3 /tmp/host.py

      - name: Restore Windows native UI implementation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/thoersch/beacon-lang/d2026b1c24b0287ccf0753cf2e88a0be05e16c92/tools/refresh-window-ui-seed.py -o /tmp/window.py
          curl -fsSL https://raw.githubusercontent.com/thoersch/beacon-lang/40597cbd673736be2c437503bd39d8681ba05c89/tools/refine-window-ui-seed.py -o /tmp/refine.py
          curl -fsSL https://raw.githubusercontent.com/thoersch/beacon-lang/40597cbd673736be2c437503bd39d8681ba05c89/tools/fix-window-ui-lazy-init.py -o /tmp/lazy.py
          curl -fsSL https://raw.githubusercontent.com/thoersch/beacon-lang/4634e74bb60a3ce5a51ded5b5d325ab798917e08/tools/fix-native-inspector-paint.py -o /tmp/paint.py
          curl -fsSL https://raw.githubusercontent.com/thoersch/beacon-lang/27b4e4352622dd9b2df443445ff9185668e064b/tools/fix-inspector-input-placeholder.py -o /tmp/placeholder.py
          python3 /tmp/window.py seed
          python3 /tmp/refine.py
          python3 /tmp/lazy.py
          python3 /tmp/paint.py
          python3 /tmp/placeholder.py

      - name: Restore inspection and typed List runtime
        shell: bash
        run: |
          set -euo pipefail
          history=https://raw.githubusercontent.com/thoersch/beacon-lang
          curl -fsSL "$history/1aed7be894e3dbc23e2e978efff94da66c973dc1/tools/inspector-runtime/Inspection.cs" -o tools/seed-refresh/Beacon.Compiler/Inspection.cs
          curl -fsSL "$history/1aed7be894e3dbc23e2e978efff94da66c973dc1/tools/inspector-runtime/patch-seed.py" -o /tmp/inspection-patch.py
          python3 /tmp/inspection-patch.py
          curl -fsSL "$history/22b5501888fc1e5c3c9868e6360141efb187c8c5/tools/typed-lists-seed/patch-runtime.py" -o /tmp/typed-patch.py
          python3 /tmp/typed-patch.py

      - name: Add generic local native extension ABI (no OpenGL in Stage-0)
        shell: bash
        run: |
          set -euo pipefail
          cp tools/native-extension-seed/NativeBridge.cs tools/seed-refresh/Beacon.Compiler/NativeBridge.cs
          python3 tools/native-extension-seed/patch-seed.py
          grep -F 'HostNativeMethod' tools/seed-refresh/Beacon.Compiler/Program.cs
          grep -F 'nativeHandle' tools/seed-refresh/Beacon.Compiler/Program.cs

      - name: Publish source-free frozen Stage-0 and independent OpenGL assembly
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish tools/seed-refresh/Beacon.Compiler/Beacon.Compiler.csproj -c Release -o /tmp/beacon-native-host -p:UseAppHost=false
          dotnet build native/opengl/Beacon.Native.opengl.csproj -c Release -o /tmp/beacon-opengl-binding -p:UseAppHost=false
          rm -rf bootstrap/stage0
          mkdir -p bootstrap/stage0
          cp /tmp/beacon-native-host/Beacon.Compiler.dll bootstrap/stage0/
          cp /tmp/beacon-native-host/Beacon.Compiler.deps.json bootstrap/stage0/
          cp /tmp/beacon-native-host/Beacon.Compiler.runtimeconfig.json bootstrap/stage0/
          cp /tmp/beacon-opengl-binding/Beacon.Native.opengl.dll native/opengl/
          cat > bootstrap/stage0/PROVENANCE.txt <<EOF
          Beacon Stage-0 bootstrap seed
          =============================

          Purpose: frozen CLR bootstrap/runtime boundary for the self-hosted Beacon compiler.
          Seed refresh: introduces one reusable, versioned hostNative(module, request) extension ABI for trusted local .NET assemblies and exposes the native handle of a Beacon window to standard-library code. No OpenGL, WGL, Silk.NET, OpenTK, or other graphics binding is included in Stage-0. All prior inspection, native UI, and typed List behaviors are preserved.
          Historical implementation language: C#
          Source branch: feature/graphics-opengl-native-extension
          .NET SDK: $(dotnet --version)

          Temporary reconstruction sources are removed after verification. The independent native/opengl/ assembly contains WGL/OpenGL bindings and can evolve separately from the bootstrap.
          Beacon's canonical compiler remains in compiler/.
          EOF
          (cd bootstrap/stage0 && sha256sum Beacon.Compiler.dll Beacon.Compiler.deps.json Beacon.Compiler.runtimeconfig.json PROVENANCE.txt > SHA256SUMS)
          (cd native/opengl && sha256sum Beacon.Native.opengl.dll > SHA256SUMS)

      - name: Verify self-host and graphics namespace on Linux
        shell: bash
        run: |
          set -euo pipefail
          export BEACON_HOME="$PWD"
          bash ./beacon.sh self-host
          output="$(bash ./beacon.sh examples/graphics-smoke.beacon)"
          expected="$(printf 'false\nfalse\nopengl')"
          if [[ "$output" != "$expected" ]]; then
            printf 'Bad portable graphics surface:\n%s\n' "$output" >&2
            exit 1
          fi
          [ "$(bash ./beacon.sh examples/graphics-triangle.beacon)" = "OpenGL example requires the Windows native window backend" ]

      - name: Commit separate bindings and new seed artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/seed-refresh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap/stage0 native/opengl/Beacon.Native.opengl.dll native/opengl/SHA256SUMS
          git commit -m 'Freeze generic native extension ABI and independent OpenGL module'
          git fetch origin feature/graphics-opengl-native-extension
          git rebase origin/feature/graphics-opengl-native-extension
          git push origin HEAD:feature/graphics-opengl-native-extension
