name: List push/pop migration

on:
  push:
    branches:
      - feature/list-push-pop

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/list-push-pop
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct current Stage-0 source baseline
        shell: bash
        run: |
          SOURCE_COMMIT=5e23c57752add5a0cb176309e44b114f8df0c327
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.b64" > /tmp/seed.1.b64
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.2.b64" > /tmp/seed.2.b64
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.3.b64" > /tmp/seed.3.b64
          git show "$SOURCE_COMMIT:tools/seed-refresh-source.4.b64" > /tmp/seed.4.b64

          cat /tmp/seed.1.b64 /tmp/seed.2.b64 /tmp/seed.3.b64 /tmp/seed.4.b64 > /tmp/seed-refresh.b64
          base64 --decode /tmp/seed-refresh.b64 > /tmp/seed-refresh.zip
          printf '%s  %s\n' '794562031c595eeef6764726cac1bfcc2109962a831848d4a1c57c3b337801f4' '/tmp/seed-refresh.zip' | sha256sum -c -

          rm -rf tools/seed-refresh
          mkdir -p tools/seed-refresh
          unzip -q /tmp/seed-refresh.zip -d tools/seed-refresh

          grep -F '@ requires a List on the left' tools/seed-refresh/Beacon.Compiler/Program.cs
          grep -F 'RecordGet' tools/seed-refresh/Beacon.Compiler/Program.cs
          grep -F 'RecordSet' tools/seed-refresh/Beacon.Compiler/Program.cs

      - name: Apply List push/pop migration
        run: python3 tools/migrate-list-push-pop.py

      - name: Verify Beacon sources no longer use append
        shell: bash
        run: |
          if grep -R '\.append(' compiler examples std --include='*.beacon' 2>/dev/null; then
            echo 'Beacon source still uses append().' >&2
            exit 1
          fi

      - name: Build refreshed Stage-0 seed
        shell: bash
        run: |
          rm -rf /tmp/beacon-stage0
          dotnet publish tools/seed-refresh/Beacon.Compiler/Beacon.Compiler.csproj \
            -c Release \
            -o /tmp/beacon-stage0 \
            -p:UseAppHost=false
          rm -f /tmp/beacon-stage0/*.pdb

      - name: Verify self-hosting and List stack semantics
        shell: bash
        run: |
          SEED=/tmp/beacon-stage0/Beacon.Compiler.dll
          COMPILER=compiler/compiler.beacon
          export BEACON_HOME="$PWD"

          dotnet "$SEED" "$COMPILER" --self-host

          cat > /tmp/list-stack.beacon <<'BEACON'
          values: list = [1, 2]
          values.push(3)
          print(values)
          print(values.pop())
          print(values)
          BEACON

          output="$(dotnet "$SEED" "$COMPILER" --stage1-run /tmp/list-stack.beacon)"
          printf '%s\n' "$output"
          expected=$'[1, 2, 3]\n3\n[1, 2]'
          [[ "$output" == "$expected" ]]

          cat > /tmp/append-removed.beacon <<'BEACON'
          values: list = [1]
          values.append(2)
          BEACON
          set +e
          append_output="$(dotnet "$SEED" "$COMPILER" --stage1-run /tmp/append-removed.beacon 2>&1)"
          append_status=$?
          set -e
          [[ $append_status -ne 0 ]]
          grep -F "List has no member 'append'" <<<"$append_output"

          cat > /tmp/pop-empty.beacon <<'BEACON'
          values: list = []
          values.pop()
          BEACON
          set +e
          pop_output="$(dotnet "$SEED" "$COMPILER" --stage1-run /tmp/pop-empty.beacon 2>&1)"
          pop_status=$?
          set -e
          [[ $pop_status -ne 0 ]]
          grep -F 'pop() cannot remove from an empty List' <<<"$pop_output"

      - name: Install refreshed seed
        shell: bash
        run: |
          rm -rf bootstrap/stage0
          mkdir -p bootstrap/stage0
          cp /tmp/beacon-stage0/Beacon.Compiler.dll bootstrap/stage0/
          cp /tmp/beacon-stage0/Beacon.Compiler.deps.json bootstrap/stage0/
          cp /tmp/beacon-stage0/Beacon.Compiler.runtimeconfig.json bootstrap/stage0/

          cat > bootstrap/stage0/PROVENANCE.txt <<EOF
          Beacon Stage-0 bootstrap seed
          =============================

          Purpose: immutable CLR bootstrap/runtime boundary for the self-hosted Beacon compiler.
          Seed refresh: List push()/pop() mutation primitives, ordered function-clause dispatch, List-only positional @ indexing, explicit Record get()/set(), filesystem/path primitives, seed-only local include composition, and generic namespace plan assembly.
          Historical implementation language: C#
          Source branch: feature/list-push-pop
          .NET SDK: $(dotnet --version)

          The one-time C# refresh source was removed after this seed was built and verified.
          The canonical compiler implementation remains Beacon source under compiler/.
          EOF

          (
            cd bootstrap/stage0
            sha256sum Beacon.Compiler.dll Beacon.Compiler.deps.json Beacon.Compiler.runtimeconfig.json PROVENANCE.txt > SHA256SUMS
          )

          export BEACON_HOME="$PWD"
          bash ./beacon.sh self-host
          [[ "$(bash ./beacon.sh /tmp/list-stack.beacon)" == $'[1, 2, 3]\n3\n[1, 2]' ]]

      - name: Commit verified runtime and source migration
        shell: bash
        run: |
          rm -rf tools/seed-refresh

          if find . -path './.git' -prune -o \( -name '*.cs' -o -name '*.csproj' \) -print | grep -q .; then
            echo 'C# source remains after seed refresh.' >&2
            find . -path './.git' -prune -o \( -name '*.cs' -o -name '*.csproj' \) -print >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler examples README.md bootstrap/stage0
          if [[ -d std ]]; then git add std; fi
          git commit -m 'Rename List append to push and add pop'
          git push origin HEAD:feature/list-push-pop
