name: Diagnose when/otherwise refactor
on:
  push:
    branches: [refine/polished-native-ui]
    paths: [.github/workflows/diagnose-when.yml]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Isolate changed compiler modules
        shell: bash
        run: |
          set -uo pipefail
          files='compiler/core.beacon compiler/lexer.beacon compiler/parser.beacon compiler/emitter.beacon compiler/source-map.beacon'
          for file in $files; do git show origin/master:"$file" > "$file"; done
          echo '==== Original compiler modules ===='
          bash ./beacon.sh self-host > /tmp/result 2>&1; echo "baseline exit: $?"; tail -n 5 /tmp/result
          for file in $files; do
            echo "==== Refactored $file ===="
            git show HEAD:"$file" > "$file"
            bash ./beacon.sh self-host > /tmp/result 2>&1; echo "$file exit: $?"; tail -n 5 /tmp/result
            git show origin/master:"$file" > "$file"
          done
