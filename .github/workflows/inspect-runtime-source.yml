name: Inspect historical runtime source
on:
  push:
    branches: [feature/live-runtime-inspection]
    paths: [.github/workflows/inspect-runtime-source.yml]
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified runtime source
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/thoersch/beacon-lang/d6680d72646aed04cda62fdb76c74325c640cd94
          curl -fsSL "$base/tools/reconstruct-current-seed.py" -o /tmp/inspector-reconstruct.py
          curl -fsSL "$base/tools/migrate-fs-path-boundary.py" -o /tmp/inspector-fs.py
          curl -fsSL "$base/tools/patch-seed-secondary-host-table.py" -o /tmp/inspector-host.py
          python3 /tmp/inspector-reconstruct.py
          python3 /tmp/inspector-fs.py seed
          python3 /tmp/inspector-host.py
      - name: Upload source snapshot for design
        uses: actions/upload-artifact@v4
        with:
          name: historical-runtime-source
          path: tools/seed-refresh/Beacon.Compiler/Program.cs
          retention-days: 1
